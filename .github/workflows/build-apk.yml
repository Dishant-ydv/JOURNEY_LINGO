name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Remove conflicting lock files
        run: |
          rm -f pnpm-workspace.yaml pnpm-lock.yaml bun.lock

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install react-is --legacy-peer-deps

      - name: Build Web Frontend
        run: |
          npx vite build

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install & Setup Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          cat << 'CONFIG' > capacitor.config.json
          {
            "appId": "com.journeylingo.app",
            "appName": "JourneyLingo",
            "webDir": "dist"
          }
          CONFIG
          npx cap add android
          npx cap sync android

      - name: Add Audio & Microphone Permissions
        run: |
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml

      - name: Enable WebView Audio and Media Permissions
        run: |
          MAIN_ACTIVITY="android/app/src/main/java/com/journeylingo/app/MainActivity.java"
          sed -i '/import com.getcapacitor.BridgeActivity;/a import android.webkit.PermissionRequest;\nimport android.webkit.WebChromeClient;\nimport android.os.Bundle;' "$MAIN_ACTIVITY"
          sed -i '/public class MainActivity extends BridgeActivity {/a \    @Override\n    public void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        this.bridge.getWebView().getSettings().setMediaPlaybackRequiresUserGesture(false);\n        this.bridge.getWebView().setWebChromeClient(new WebChromeClient() {\n            @Override\n            public void onPermissionRequest(final PermissionRequest request) {\n                request.grant(request.getResources());\n            }\n        });\n    }' "$MAIN_ACTIVITY"

      - name: Fix Kotlin Duplicate Class Conflict
        run: |
          echo "
          configurations.all {
              resolutionStrategy.eachDependency { DependencyResolveDetails details ->
                  def requested = details.requested
                  if (requested.group == 'org.jetbrains.kotlin') {
                      details.useVersion '1.8.22'
                  }
              }
          }
          " >> android/app/build.gradle

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JourneyLingo-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
